apiVersion: apps/v1
kind: Deployment
metadata:
  name: registrarcliente-deployment
  labels:
    app: registrarcliente
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registrarcliente
  template:
    metadata:
      labels:
        app: registrarcliente
    spec:
      containers:
      - name: registrarcliente
        image: tu-usuario-dockerhub/registrarcliente:latest # Reemplaza con tu imagen
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "500m"
