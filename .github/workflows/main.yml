name: CI/CD Pipeline Completo a AWS EC2

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # 1. Pruebas unitarias y cobertura con JaCoCo
  test:
    name: Pruebas con JaCoCo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registrarcliente
    steps:
      - uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and test
        run: mvn clean verify

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: registrarcliente/target/site/jacoco/

  # 2. Análisis de Calidad y Seguridad con SonarCloud (Cumple IE5 e IE6)
  sonar-analysis:
    name: Análisis en SonarCloud
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: registrarcliente
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
          -Dsonar.projectKey=Vicente-valdivia_DevopsEP-1 \
          -Dsonar.organization=vicente-valdivia \
          -Dsonar.host.url=https://sonarcloud.io

  # 3. Despliegue Automatizado en Amazon EC2 (Cumple IE2)
  deploy:
    name: Despliegue en AWS EC2
    needs: sonar-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Conectar a EC2 y Desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Preparar el servidor: Instalar Java 17 y Docker Compose
            sudo yum install java-17-amazon-corretto -y
            mkdir -p ~/.docker/cli-plugins/
            curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
            chmod +x ~/.docker/cli-plugins/docker-compose
            
            # 2. Descargar el código (Forzando a que sea identico a GitHub)
            if [ ! -d "DevopsEP-1" ]; then
              git clone https://github.com/Vicente-valdivia/DevopsEP-1.git
            fi
            
            cd DevopsEP-1
            git fetch origin
            git reset --hard origin/master
            
            # 3. Compilar el ejecutable de Spring Boot
            cd registrarcliente
            chmod +x mvnw
            ./mvnw clean package -DskipTests
            cd ..
            
            # 4. Orquestar los contenedores en producción
            docker compose down
            docker compose up -d --build
