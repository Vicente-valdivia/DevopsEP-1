name: CI/CD Pipeline Completo a AWS EC2

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # 1. Análisis de Seguridad con Snyk (Cumple IE6 de la rúbrica)
  snyk-scan:
    name: Escaneo de Seguridad con Snyk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registrarcliente
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # TRUCO: Descargamos las dependencias antes para que Snyk no colapse la memoria
      - name: Resolver dependencias de Maven
        run: mvn dependency:resolve

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate and Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: snyk test --severity-threshold=high

      - name: Generate Snyk JSON Report
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: snyk test --json > snyk-report.json || true

  # 2. Pruebas unitarias y cobertura con JaCoCo
  test:
    name: Pruebas con JaCoCo
    runs-on: ubuntu-latest
    needs: snyk-scan
    defaults:
      run:
        working-directory: registrarcliente
    steps:
      - uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and test
        run: mvn clean verify

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: registrarcliente/target/site/jacoco/

  # 3. Análisis de Calidad con SonarCloud (Cumple IE5)
  sonar-analysis:
    name: Análisis en SonarCloud
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: registrarcliente
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que Sonar analice el historial completo

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
          -Dsonar.projectKey=Vicente-valdivia_DevopsEP-1 \
          -Dsonar.organization=vicente-valdivia \
          -Dsonar.host.url=https://sonarcloud.io

  # 4. Despliegue Automatizado en Amazon EC2 (Cumple IE2)
  deploy:
    name: Despliegue en AWS EC2
    needs: sonar-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Conectar a EC2 y Desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Clonar el repositorio si no existe en el servidor
            if [ ! -d "DevopsEP-1" ]; then
              git clone https://github.com/Vicente-valdivia/DevopsEP-1.git
            fi
            
            # 2. Entrar a la carpeta y sincronizar los últimos cambios
            cd DevopsEP-1
            git pull origin master
            
            # 3. Compilar el ejecutable fresco dentro de EC2
            cd registrarcliente
            chmod +x mvnw
            ./mvnw clean package -DskipTests
            cd ..
            
            # 4. Orquestar los contenedores (Apagar viejos, encender nuevos)
            docker compose down
            docker compose up -d --build
