name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # 1. Análisis de Seguridad con Snyk
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registrarcliente
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Forzamos a Maven a resolver e instalar las dependencias localmente antes del escaneo
      - name: Resolve Dependencies
        run: mvn dependency:resolve

      # Usamos la Action Oficial de Snyk para evitar el error de hilos/memoria de NPM
      - name: Run Snyk Test
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --directory=registrarcliente

      # Generación del reporte en JSON (Si quieres mantener el artefacto)
      - name: Run Snyk Monitor / Report
        if: always()
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --directory=registrarcliente
  # 2. Pruebas unitarias y cobertura con JaCoCo
  test:
    name: Run Tests with JaCoCo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registrarcliente
    steps:
      - uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and test
        run: mvn clean verify

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: registrarcliente/target/site/jacoco/

  # 3. Análisis de Calidad con SonarCloud
  sonar-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: registrarcliente
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que Sonar analice el historial

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
          -Dsonar.projectKey=Vicente-valdivia_DevopsEP-1 \
          -Dsonar.organization=vicente-valdivia \
          -Dsonar.host.url=https://sonarcloud.io

  # 4. Empaquetado final de la aplicación
  build:
    name: Build Jar
    runs-on: ubuntu-latest
    needs: [snyk-scan, sonar-analysis]
    defaults:
      run:
        working-directory: registrarcliente
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Package application
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: registrarcliente/target/*.jar

  # 5. Despliegue Automatizado en Amazon EKS (Cumple IE1, IE2, IE4 e IE5)
  deploy-aws:
    name: Build Docker & Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Descargar artefacto JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: registrarcliente/target/

      # Inicio de sesión en DockerHub para almacenar la imagen
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construye y sube la imagen Docker basada en tu archivo Dockerfile
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/registrarcliente:latest -f registrarcliente/Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/registrarcliente:latest
